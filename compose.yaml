name: bop

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bop}
      POSTGRES_USER: ${POSTGRES_USER:-bop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bop_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bop}:${POSTGRES_PASSWORD:-bop_local}@db:5432/${POSTGRES_DB:-bop}
      MEDIA_ROOT: /data/media
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-536870912}
      MEDIA_VALIDATION_TIMEOUT_SECONDS: ${MEDIA_VALIDATION_TIMEOUT_SECONDS:-120}
      XAI_API_KEY: ${XAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_KNOWLEDGE_MODEL: ${OPENROUTER_KNOWLEDGE_MODEL:-openai/gpt-4o-mini}
      EVENT_WORKER_INTERVAL_SECONDS: ${EVENT_WORKER_INTERVAL_SECONDS:-3}
      TRANSCRIPTION_CONCURRENCY: ${TRANSCRIPTION_CONCURRENCY:-4}
      SEGMENT_SECONDS: ${SEGMENT_SECONDS:-10}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/data/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:

